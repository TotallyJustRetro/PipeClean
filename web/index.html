<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101724">
  <title>PipeClean — Super Mario Land 2 Online</title>
  <script src="https://staging.yougame.co/sdk.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101724; color: #eef2fb; font: 14px system-ui, sans-serif; }
    body { position: relative; display: block; }
    #pc-status { position: absolute; z-index: 20; left: 0; right: 0; top: 0; box-sizing: border-box; height: 34px; padding: 8px 12px; color: #bac5dc; background: #0a101a; pointer-events: none; }
    #pc-game-surface { position: absolute; left: 72px; top: 72px; right: 192px; bottom: 60px; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; touch-action: none; user-select: none; -webkit-touch-callout: none; }
    #pc-local-tools { display: none; position: fixed; z-index: 100; left: 12px; top: 12px; padding: 10px; max-width: 300px; border: 1px solid #61708d; border-radius: 10px; background: rgba(10,16,26,.94); box-shadow: 0 8px 28px #0008; }
    #pc-local-tools button { padding: 8px 12px; border-radius: 7px; border: 0; background: #4e80de; color: white; font-weight: 600; }
    #pc-local-tools p { margin: 6px 0 0; color: #bac5dc; font-size: 12px; }
  </style>
  <script>
    var Module = {
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        var el = document.getElementById('pc-status');
        if (el) el.textContent = text || 'PipeClean is running.';
      },
      onRuntimeInitialized: function () {
        window.pcPipeCleanReady = true;
        document.getElementById('pc-status').textContent = 'PipeClean browser runtime ready.';
        var surface = document.getElementById('pc-game-surface');
        var status = document.getElementById('pc-status');
        var showLocalPicker = function () {
          if (typeof YouGame === 'undefined' || YouGame.mode !== 'bridge') {
            document.getElementById('pc-local-tools').style.display = 'block';
            if (status) status.style.display = 'block';
            surface.style.left = '0px'; surface.style.top = '34px';
            surface.style.right = '0px'; surface.style.bottom = '0px';
          }
        };
        var applyHostLayout = function (layout) {
          if (!layout || (layout.status !== 'ready' && layout.status !== 'standalone')) return;
          var insets = layout.insets || { left: 0, top: 0, right: 0, bottom: 0 };
          surface.style.left = Math.max(0, insets.left || 0) + 'px';
          surface.style.top = Math.max(0, insets.top || 0) + 'px';
          surface.style.right = Math.max(0, insets.right || 0) + 'px';
          surface.style.bottom = Math.max(0, insets.bottom || 0) + 'px';
          if (layout.status === 'ready') {
            if (status) status.style.display = 'none';
          } else {
            if (status) status.style.display = 'block';
          }
        };
        if (typeof YouGame !== 'undefined' && YouGame.ready) {
          YouGame.ready().then(function () {
            showLocalPicker();
            if (YouGame.ui && YouGame.ui.onChange) {
              YouGame.ui.onChange(function (layout) { applyHostLayout(layout); });
              applyHostLayout(YouGame.ui.getLayout());
            }
          }).catch(showLocalPicker);
        } else showLocalPicker();
      }
    };
  </script>
</head>
<body>
  <div id="pc-status">Loading PipeClean…</div>
  <div id="pc-game-surface">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <script>Module.canvas = document.getElementById('canvas');</script>
  <div id="pc-local-tools">
    <button id="pc-load-rom" type="button">Load my SML2 ROM (local test)</button>
    <p>Standalone development only. The hosted YouGame listing uses the player's accepted base-game copy instead.</p>
    <input id="pc-rom-file" type="file" accept=".gb,.gbc" hidden>
  </div>
  <script>
    document.getElementById('pc-load-rom').addEventListener('click', function () {
      document.getElementById('pc-rom-file').click();
    });
    document.getElementById('pc-rom-file').addEventListener('change', async function (event) {
      var file = event.target.files && event.target.files[0];
      if (!file || !window.pcPipeCleanReady) return;
      try {
        var bytes = new Uint8Array(await file.arrayBuffer());
        var digest = await crypto.subtle.digest('SHA-1', bytes);
        var sha1 = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
        var ptr = Module._malloc(bytes.length);
        if (!ptr) throw new Error('Not enough memory to import the ROM.');
        Module.HEAPU8.set(bytes, ptr);
        var ok = Module._pc_yg_import_base_rom(ptr, bytes.length);
        Module._free(ptr);
        if (!ok) throw new Error('That file is not a supported Super Mario Land 2 ROM.');
        var state = window.__pcYouGame || (window.__pcYouGame = {});
        state.baseSha1 = sha1;
        document.getElementById('pc-status').textContent = 'SML2 ROM loaded for local testing.';
        document.getElementById('pc-local-tools').style.display = 'none';
      } catch (error) {
        document.getElementById('pc-status').textContent = String(error && error.message || error);
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
