name: PipeClean Native YouGame Windows

on:
  push:
    branches: [feature/yougame-native-windows]
  pull_request:
    branches: [feature/yougame-native-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeclean-native-yougame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-yougame:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-cmake
            make
            python
            git

      - name: Verify Windows toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion sdl2

      - name: Generate synthetic SML2-shaped ROM
        shell: pwsh
        run: |
          $rom = New-Object byte[] (512 * 1024)
          $title = [Text.Encoding]::ASCII.GetBytes("MARIOLAND2")
          [Array]::Copy($title, 0, $rom, 0x134, $title.Length)
          $rom[0x147] = 0x01
          $rom[0x148] = 0x04
          $rom[0x149] = 0x00
          $rom[0x801C] = 0x19
          New-Item -ItemType Directory -Force ci | Out-Null
          [IO.File]::WriteAllBytes("$PWD\ci\sml2_smoke.gb", $rom)

      - name: Configure PipeClean with native YouGame SDK
        shell: msys2 {0}
        run: |
          cmake -S . -B build-native-yougame \
            -DROM="$PWD/ci/sml2_smoke.gb" \
            -DPIPECLEAN_ENABLE_YOUGAME_NATIVE=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          cmake --build build-native-yougame --target PipeClean --parallel 2

      - name: Smoke-test Windows runtime
        shell: msys2 {0}
        run: |
          ./build-native-yougame/PipeClean.exe --headless --frames 2 --no-crc-check --wide 100 ci/sml2_smoke.gb

      - name: Stage native YouGame Windows runtime
        shell: msys2 {0}
        run: |
          mkdir -p dist/PipeClean-Native-YouGame-Windows-x64/assets
          cp build-native-yougame/PipeClean.exe dist/PipeClean-Native-YouGame-Windows-x64/PipeClean.exe
          cp assets/pipeclean-icon.svg assets/pipeclean-logo.svg assets/pipeclean-logo.webp assets/cacert.pem dist/PipeClean-Native-YouGame-Windows-x64/assets/
          {
            ldd build-native-yougame/PipeClean.exe
            ldd /ucrt64/bin/SDL2.dll
          } | awk '/=> \/ucrt64\// {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/PipeClean-Native-YouGame-Windows-x64/
          done
          cp README.md INSTALL.md LEGAL.md THIRD_PARTY.md docs/yougame-native-windows.md dist/PipeClean-Native-YouGame-Windows-x64/
          test -s dist/PipeClean-Native-YouGame-Windows-x64/PipeClean.exe
          test -s dist/PipeClean-Native-YouGame-Windows-x64/assets/pipeclean-logo.webp
          test -s dist/PipeClean-Native-YouGame-Windows-x64/assets/cacert.pem
          ldd dist/PipeClean-Native-YouGame-Windows-x64/PipeClean.exe | grep -q "not found" && exit 1 || true

      - name: Package native Windows runtime
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PipeClean-Native-YouGame-Windows-x64 -DestinationPath PipeClean-Native-YouGame-Windows-x64.zip -Force

      - name: Upload native Windows build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Native-YouGame-Windows-x64
          path: PipeClean-Native-YouGame-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
