name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build SML2 widescreen regression test
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime             tests/test_sml2_wide.c runtime/widescreen.c             -o test_sml2_wide

      - name: Run SML2 widescreen regression test
        run: ./test_sml2_wide

      - name: Build and run SML1 widescreen regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime             tests/test_sml_wide.c runtime/widescreen.c             -o test_sml_wide
          ./test_sml_wide

      - name: Build and run MBC1 mapper regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime             tests/test_cart_mbc1.c runtime/cart.c runtime/patch.c             -o test_cart_mbc1
          ./test_cart_mbc1

      - name: Validate Python tools
        run: |
          python3 -m py_compile             tools/recomp.py             tools/sm83.py             tools/dis.py             tools/discover.py             tools/make_font.py

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(512 * 1024)

          # DMG header fields needed by PipeClean's cartridge parser.
          rom[0x134:0x134 + 10] = b"MARIOLAND2"
          rom[0x147] = 0x01   # MBC1 + no RAM
          rom[0x148] = 0x04   # 512 KiB ROM
          rom[0x149] = 0x00   # no external RAM

          # SML2 widescreen hook signature:
          # bank 2, address $401C -> file offset $801C.
          rom[0x801C] = 0x19   # ADD HL,DE

          Path("ci/sml2_smoke.gb").parent.mkdir(parents=True, exist_ok=True)
          Path("ci/sml2_smoke.gb").write_bytes(rom)
          PY

      - name: Configure full runtime
        run: |
          cmake -S . -B build-ci -DROM="$GITHUB_WORKSPACE/ci/sml2_smoke.gb"

      - name: Build full runtime and test target
        run: |
          cmake --build build-ci --target gb test_sml2_wide test_sml_wide test_cart_mbc1 --parallel 2
          ctest --test-dir build-ci --output-on-failure

      - name: Smoke-test SML2 interpreter and CLI widescreen path
        run: |
          timeout 15s build-ci/gb             --headless             --frames 2             --no-crc-check             --wide 100             ci/sml2_smoke.gb

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          gcc --version
          cmake --version
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: Install SDL2 for MinGW
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2:x64-mingw-static

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        shell: pwsh
        run: |
          $rom = New-Object byte[] (512 * 1024)
          $title = [Text.Encoding]::ASCII.GetBytes("MARIOLAND2")
          [Array]::Copy($title, 0, $rom, 0x134, $title.Length)
          $rom[0x147] = 0x01
          $rom[0x148] = 0x04
          $rom[0x149] = 0x00
          $rom[0x801C] = 0x19
          New-Item -ItemType Directory -Force ci | Out-Null
          [IO.File]::WriteAllBytes("$PWD\ci\sml2_smoke.gb", $rom)

      - name: Configure Windows build
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -G "MinGW Makefiles" -S . -B build-windows -DROM="$PWD\ci\sml2_smoke.gb" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-mingw-static

      - name: Build Windows runtime
        shell: pwsh
        run: |
          cmake --build build-windows --target gb --parallel 2

      - name: Smoke-test Windows runtime
        shell: pwsh
        run: |
          & "$PWD\build-windows\gb.exe" --headless --frames 2 --no-crc-check --wide 100 "$PWD\ci\sml2_smoke.gb"

      - name: Package Windows runtime artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\PipeClean-Windows-x64 | Out-Null
          Copy-Item build-windows\gb.exe dist\PipeClean-Windows-x64\PipeClean.exe
          Copy-Item README.md, INSTALL.md, LEGAL.md, THIRD_PARTY.md dist\PipeClean-Windows-x64\
          Compress-Archive -Path dist\PipeClean-Windows-x64 -DestinationPath PipeClean-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Windows-x64
          path: PipeClean-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
