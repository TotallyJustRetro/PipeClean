name: Regression Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bundled third-party sources
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o runtime/stb_image.h
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h -o runtime/stb_image_write.h
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h -o runtime/stb_truetype.h
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_vorbis.c -o runtime/stb_vorbis.inc
          curl -fsSL https://raw.githubusercontent.com/mackron/dr_libs/master/dr_wav.h -o runtime/dr_wav.h
          curl -fsSL https://raw.githubusercontent.com/mackron/dr_libs/master/dr_mp3.h -o runtime/dr_mp3.h
          curl -fsSL https://raw.githubusercontent.com/mackron/dr_libs/master/dr_flac.h -o runtime/dr_flac.h

      - name: Restore launcher font data
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf -o /tmp/Poppins-Regular.ttf
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf -o /tmp/Poppins-Bold.ttf
          python3 tools/make_font.py /tmp/Poppins-Regular.ttf /tmp/Poppins-Bold.ttf

      - name: Commit restored vendor sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/stb_image.h runtime/stb_image_write.h runtime/stb_truetype.h \
                  runtime/stb_vorbis.inc runtime/dr_wav.h runtime/dr_mp3.h runtime/dr_flac.h \
                  runtime/font_data.c
          if git diff --cached --quiet; then
            echo "Vendor sources already current."
          else
            git commit -m "Restore bundled third-party source files"
            git fetch origin main
            git rebase origin/main
            if git log origin/main..HEAD --oneline | grep -q .; then
              git push origin HEAD:main
            else
              echo "Vendor restoration was already pushed by another run."
            fi
          fi

      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build SML2 widescreen regression test
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime             tests/test_sml2_wide.c runtime/widescreen.c             -o test_sml2_wide

      - name: Run SML2 widescreen regression test
        run: ./test_sml2_wide

      - name: Validate Python tools
        run: |
          python3 -m py_compile             tools/recomp.py             tools/sm83.py             tools/dis.py             tools/discover.py             tools/make_font.py

      - name: Configure full runtime with synthetic 512 KiB ROM
        run: |
          mkdir -p ci build-ci
          truncate -s 524288 ci/smoke_512k.gb
          cmake -S . -B build-ci -DROM="$GITHUB_WORKSPACE/ci/smoke_512k.gb"

      - name: Build full runtime and test target
        run: |
          cmake --build build-ci --target gb test_sml2_wide --parallel 2
          ctest --test-dir build-ci --output-on-failure
