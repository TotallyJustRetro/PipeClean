name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a regression run just because another commit lands on main.
# This keeps uploads/large source commits from leaving the latest run stuck as cancelled.
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build SML2 widescreen regression test
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_sml2_wide.c runtime/widescreen.c \
            -o test_sml2_wide

      - name: Run SML2 widescreen regression test
        run: ./test_sml2_wide

      - name: Build and run SML1 widescreen regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_sml_wide.c runtime/widescreen.c \
            -o test_sml_wide
          ./test_sml_wide

      - name: Build and run MBC1 mapper regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_cart_mbc1.c runtime/cart.c runtime/patch.c \
            -o test_cart_mbc1
          ./test_cart_mbc1

      - name: Validate Python tools
        run: |
          python3 -m py_compile \
            tools/recomp.py \
            tools/sm83.py \
            tools/gbdis.py \
            tools/discover.py \
            tools/make_font.py

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(512 * 1024)

          # DMG header fields needed by PipeClean's cartridge parser.
          rom[0x134:0x134 + 10] = b"MARIOLAND2"
          rom[0x147] = 0x01   # MBC1 + no RAM
          rom[0x148] = 0x04   # 512 KiB ROM
          rom[0x149] = 0x00   # no external RAM

          # SML2 widescreen hook signature:
          # bank 2, address $401C -> file offset $801C.
          rom[0x801C] = 0x19   # ADD HL,DE

          Path("ci/sml2_smoke.gb").parent.mkdir(parents=True, exist_ok=True)
          Path("ci/sml2_smoke.gb").write_bytes(rom)
          PY

      - name: Configure full runtime
        run: |
          cmake -S . -B build-ci -DROM="$GITHUB_WORKSPACE/ci/sml2_smoke.gb"

      - name: Build full runtime and test target
        run: |
          cmake --build build-ci --target PipeClean test_sml2_wide test_sml_wide test_cart_mbc1 --parallel 2
          ctest --test-dir build-ci --output-on-failure

      - name: Smoke-test SML2 interpreter and CLI widescreen path
        run: |
          timeout 15s build-ci/PipeClean \
            --headless \
            --frames 2 \
            --no-crc-check \
            --wide 100 \
            ci/sml2_smoke.gb

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cmake

      - name: Verify Windows toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion sdl2

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        shell: pwsh
        run: |
          $rom = New-Object byte[] (512 * 1024)
          $title = [Text.Encoding]::ASCII.GetBytes("MARIOLAND2")
          [Array]::Copy($title, 0, $rom, 0x134, $title.Length)
          $rom[0x147] = 0x01
          $rom[0x148] = 0x04
          $rom[0x149] = 0x00
          $rom[0x801C] = 0x19
          New-Item -ItemType Directory -Force ci | Out-Null
          [IO.File]::WriteAllBytes("$PWD\ci\sml2_smoke.gb", $rom)

      - name: Configure Windows build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-windows -DROM="$PWD/ci/sml2_smoke.gb" -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows runtime
        shell: msys2 {0}
        run: |
          cmake --build build-windows --target PipeClean --parallel 2

      - name: Smoke-test Windows runtime
        shell: msys2 {0}
        run: |
          ./build-windows/PipeClean.exe --headless --frames 2 --no-crc-check --wide 100 ci/sml2_smoke.gb

      - name: Stage Windows runtime and required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist/PipeClean-Windows-x64
          cp build-windows/PipeClean.exe dist/PipeClean-Windows-x64/PipeClean.exe
          {
            ldd build-windows/PipeClean.exe
            ldd /ucrt64/bin/SDL2.dll
          } | awk '/=> \/ucrt64\// {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/PipeClean-Windows-x64/
          done

      - name: Package Windows runtime artifact
        shell: pwsh
        run: |
          Copy-Item README.md, INSTALL.md, LEGAL.md, THIRD_PARTY.md dist\PipeClean-Windows-x64\
          Compress-Archive -Path dist\PipeClean-Windows-x64 -DestinationPath PipeClean-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Windows-x64
          path: PipeClean-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
