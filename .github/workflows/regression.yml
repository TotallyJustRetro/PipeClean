name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a regression run just because another commit lands on main.
# This keeps uploads/large source commits from leaving the latest run stuck as cancelled.
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev

      - name: Build SML2 widescreen regression test
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_sml2_wide.c runtime/widescreen.c \
            -o test_sml2_wide

      - name: Run SML2 widescreen regression test
        run: ./test_sml2_wide

      - name: Build and run SML1 widescreen regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_sml_wide.c runtime/widescreen.c \
            -o test_sml_wide
          ./test_sml_wide

      - name: Build and run MBC1 mapper regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime \
            tests/test_cart_mbc1.c runtime/cart.c runtime/patch.c \
            -o test_cart_mbc1
          ./test_cart_mbc1

      - name: Build and run CGB PPU renderer regression
        run: |
          gcc -std=c11 -Wall -Wextra -Iruntime tests/test_cgb_ppu.c runtime/ppu.c -o test_cgb_ppu
          ./test_cgb_ppu

      - name: Validate Python tools
        run: |
          python3 -m py_compile \
            tools/recomp.py \
            tools/sm83.py \
            tools/gbdis.py \
            tools/discover.py \
            tools/make_font.py \
            tools/mp_test.py

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(512 * 1024)

          # DMG header fields needed by PipeClean's cartridge parser.
          rom[0x134:0x134 + 10] = b"MARIOLAND2"
          rom[0x147] = 0x01   # MBC1 + no RAM
          rom[0x148] = 0x04   # 512 KiB ROM
          rom[0x149] = 0x00   # no external RAM

          # SML2 widescreen hook signature:
          # bank 2, address $401C -> file offset $801C.
          rom[0x801C] = 0x19   # ADD HL,DE

          Path("ci/sml2_smoke.gb").parent.mkdir(parents=True, exist_ok=True)
          Path("ci/sml2_smoke.gb").write_bytes(rom)
          PY

      - name: Generate synthetic SML2 VBlank driver for multiplayer tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(512 * 1024)
          rom[0x134:0x134 + 10] = b"MARIOLAND2"
          rom[0x147] = 0x03   # MBC1 + RAM + battery
          rom[0x148] = 0x04   # 512 KiB ROM
          rom[0x149] = 0x03   # 32 KiB RAM
          rom[0x0040] = 0xD9  # VBlank ISR: RETI, so the multiplayer frame watcher can yield
          # Initialize stack/LCD/IE, enable interrupts, then idle in HALT.
          rom[0x0100:0x0110] = bytes([
              0x31, 0xFE, 0xFF,       # LD SP,$FFFE
              0x3E, 0x91,             # LD A,$91
              0xE0, 0x40,             # LDH ($FF40),A (LCD on)
              0x3E, 0x01,             # LD A,$01
              0xEA, 0xFF, 0xFF,       # LD ($FFFF),A (VBlank IRQ enabled)
              0xFB,                   # EI
              0x76,                   # HALT
              0x18, 0xFD,             # JR back to HALT
          ])
          rom[0x801C] = 0x19  # SML2 widescreen signature for header-compatible tooling
          Path("ci/sml2_mp_driver.gb").write_bytes(rom)
          PY

      - name: Generate synthetic Wario mapper smoke ROMs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          specs = [
              ("wario-sml3.gb", 512 * 1024, b"SUPERMARIOLAND3", 0x00, 0x03, 0x04, 0x02),
              ("wario2-gb.gb", 1024 * 1024, b"WARIOLAND2", 0x00, 0x13, 0x05, 0x03),
              ("wario3-gbc.gbc", 2 * 1024 * 1024, b"WARIOLAND3", 0xC0, 0x1B, 0x06, 0x03),
              ("wario2-gbc.gbc", 2 * 1024 * 1024, b"CGBWARIOLAND2", 0x80, 0x1B, 0x06, 0x03),
          ]
          out = Path("ci/wario-smoke")
          out.mkdir(parents=True, exist_ok=True)
          for name, size, title, cgb, cart, rom_size, ram_size in specs:
              rom = bytearray(size)
              rom[0x134:0x144] = title[:16].ljust(16, bytes([0]))
              rom[0x143] = cgb
              rom[0x147] = cart
              rom[0x148] = rom_size
              rom[0x149] = ram_size
              (out / name).write_bytes(rom)
          PY

      - name: Generate synthetic CGB speed-switch ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(32 * 1024)
          rom[0x134:0x13C] = b"STOPTEST"
          rom[0x143] = 0x80  # CGB-enhanced cartridge
          rom[0x147] = 0x00  # ROM-only mapper
          rom[0x148] = 0x00  # 32 KiB
          rom[0x149] = 0x00
          # LD A,1; LDH (KEY1),A; STOP; LDH A,(KEY1); LD (C000),A; JR -2
          rom[0x100:0x10C] = bytes([
              0x3E, 0x01, 0xE0, 0x4D, 0x10, 0x00,
              0xF0, 0x4D, 0xEA, 0x00, 0xC0, 0x18
          ])
          rom[0x10C] = 0xFE
          Path("ci/cgb_stop.gb").write_bytes(rom)
          PY

      - name: Configure full runtime
        run: |
          cmake -S . -B build-ci -DROM="$GITHUB_WORKSPACE/ci/sml2_smoke.gb"

      - name: Build full runtime and test target
        run: |
          cmake --build build-ci --target PipeClean test_sml2_wide test_sml_wide test_cart_mbc1 test_recomp_guard --parallel 2
          ctest --test-dir build-ci --output-on-failure

      - name: Smoke-test CGB STOP speed switching
        run: |
          timeout 15s build-ci/PipeClean --frames 2 --no-crc-check --dump-ram ci/cgb-stop-ram.bin ci/cgb_stop.gb
          python3 - <<'PY'
          from pathlib import Path
          ram = Path("ci/cgb-stop-ram.bin").read_bytes()
          assert ram[0] == 0xFE, f"KEY1 did not switch to double speed: C000={ram[0]:02X}"
          PY

      - name: Smoke-test Wario Land GB/GBC mapper entries
        run: |
          for rom in ci/wario-smoke/*.gb ci/wario-smoke/*.gbc; do
            echo "Testing $rom"
            timeout 15s build-ci/PipeClean --frames 2 "$rom"
          done

      - name: Smoke-test SML2 interpreter and CLI widescreen path
        run: |
          timeout 15s build-ci/PipeClean \
            --headless \
            --frames 2 \
            --no-crc-check \
            --wide 100 \
            ci/sml2_smoke.gb

      - name: Test scripted multiplayer runner and deterministic replay
        run: |
          python3 tools/mp_test.py \
            --binary build-ci/PipeClean \
            --rom ci/sml2_mp_driver.gb \
            --script tests/scenarios/runner_smoke.txt \
            --frames 8 \
            --report-dir ci/mp-test-report

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-cmake

      - name: Verify Windows toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion sdl2

      - name: Generate synthetic SML2-shaped 512 KiB ROM
        shell: pwsh
        run: |
          $rom = New-Object byte[] (512 * 1024)
          $title = [Text.Encoding]::ASCII.GetBytes("MARIOLAND2")
          [Array]::Copy($title, 0, $rom, 0x134, $title.Length)
          $rom[0x147] = 0x01
          $rom[0x148] = 0x04
          $rom[0x149] = 0x00
          $rom[0x801C] = 0x19
          New-Item -ItemType Directory -Force ci | Out-Null
          [IO.File]::WriteAllBytes("$PWD\ci\sml2_smoke.gb", $rom)

      - name: Configure Windows build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-windows -DROM="$PWD/ci/sml2_smoke.gb" -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows runtime
        shell: msys2 {0}
        run: |
          cmake --build build-windows --target PipeClean --parallel 2

      - name: Smoke-test Windows runtime
        shell: msys2 {0}
        run: |
          ./build-windows/PipeClean.exe --headless --frames 2 --no-crc-check --wide 100 ci/sml2_smoke.gb

      - name: Stage Windows runtime and required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist/PipeClean-Windows-x64/assets
          cp build-windows/PipeClean.exe dist/PipeClean-Windows-x64/PipeClean.exe
          cp assets/pipeclean-icon.svg assets/pipeclean-logo.svg assets/pipeclean-logo.webp dist/PipeClean-Windows-x64/assets/
          {
            ldd build-windows/PipeClean.exe
            ldd /ucrt64/bin/SDL2.dll
          } | awk '/=> \/ucrt64\// {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/PipeClean-Windows-x64/
          done
          test -s dist/PipeClean-Windows-x64/assets/pipeclean-icon.svg
          test -s dist/PipeClean-Windows-x64/assets/pipeclean-logo.svg
          test -s assets/pipeclean-logo.webp
          test -s dist/PipeClean-Windows-x64/assets/pipeclean-logo.webp

      - name: Package Windows runtime artifact
        shell: pwsh
        run: |
          Copy-Item README.md, INSTALL.md, LEGAL.md, THIRD_PARTY.md dist\PipeClean-Windows-x64\
          Compress-Archive -Path dist\PipeClean-Windows-x64 -DestinationPath PipeClean-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Windows-x64
          path: PipeClean-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
