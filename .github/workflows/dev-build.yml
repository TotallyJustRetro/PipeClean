name: PipeClean Dev Build

on:
  push:
    branches: [main, feature/online-android-foundation, feature/android-pipe-screen-swap]
  pull_request:
    branches: [main, fix/sml-dx-widescreen-revision, feature/online-android-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeclean-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-dev-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git make python3 libsdl2-dev libsdl2-image-dev

      - name: Build bundled Wario player
        run: |
          git clone --depth 1 --branch feature/wario-companion-deck https://github.com/TotallyJustRetro/warko.git ci/warko
          echo "Wario player source commit: $(git -C ci/warko rev-parse HEAD)"
          python3 ci/warko/gbrecomp.py --player -o ci/warko/build/player
          make -C ci/warko/build/player OPT=-O2 -j2
          test -x ci/warko/build/player/gbplayer

      - name: Verify Linux toolchain
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion sdl2
          pkg-config --modversion SDL2_image

      - name: Generate synthetic SML2-shaped ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(512 * 1024)
          rom[0x134:0x134 + 10] = b"MARIOLAND2"
          rom[0x147] = 0x01
          rom[0x148] = 0x04
          rom[0x149] = 0x00
          rom[0x801C] = 0x19
          Path("ci/sml2_smoke.gb").parent.mkdir(parents=True, exist_ok=True)
          Path("ci/sml2_smoke.gb").write_bytes(rom)
          PY

      - name: Configure PipeClean Dev
        run: |
          cmake -S . -B build-dev -DROM="$GITHUB_WORKSPACE/ci/sml2_smoke.gb" -DCMAKE_BUILD_TYPE=Release -DPIPECLEAN_DEV_BUILD=ON

      - name: Build developer runtime
        run: cmake --build build-dev --target PipeClean --parallel 2

      - name: Smoke-test developer runtime
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          timeout 15s build-dev/PipeClean --headless --frames 2 --no-crc-check --wide 100 ci/sml2_smoke.gb

      - name: Stage Linux runtime and assets
        run: |
          mkdir -p dist/PipeClean-Dev-Linux-x64/assets
          cp build-dev/PipeClean dist/PipeClean-Dev-Linux-x64/PipeClean
          cp ci/warko/build/player/gbplayer dist/PipeClean-Dev-Linux-x64/gbplayer
          cp assets/pipeclean-icon.svg assets/pipeclean-logo.svg assets/pipeclean-logo.webp assets/cacert.pem dist/PipeClean-Dev-Linux-x64/assets/
          cp README.md INSTALL.md LEGAL.md THIRD_PARTY.md dist/PipeClean-Dev-Linux-x64/
          printf '%s\n' \
            'PipeClean Linux dependencies:' \
            '  - SDL2 runtime (SDL2 2.x)' \
            '  - SDL2_image runtime' \
            '  - Python 3 is not required to run the packaged native runtime.' \
            '' \
            'On Ubuntu/Debian, install missing runtime libraries with:' \
            '  sudo apt install libsdl2-2.0-0 libsdl2-image-2.0-0' \
            '' \
            'Run from this directory with: ./PipeClean' \
            > dist/PipeClean-Dev-Linux-x64/README-Linux.txt
          for bin in dist/PipeClean-Dev-Linux-x64/PipeClean dist/PipeClean-Dev-Linux-x64/gbplayer; do
            if ldd "$bin" | grep -q "not found"; then
              ldd "$bin"
              exit 1
            fi
          done
          test -s dist/PipeClean-Dev-Linux-x64/assets/pipeclean-icon.svg
          test -s dist/PipeClean-Dev-Linux-x64/assets/pipeclean-logo.webp
          test -s dist/PipeClean-Dev-Linux-x64/assets/cacert.pem

      - name: Package Linux runtime artifact
        run: tar -czf PipeClean-Dev-Linux-x64.tar.gz -C dist PipeClean-Dev-Linux-x64

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Dev-Linux-x64
          path: PipeClean-Dev-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-dev-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-cmake
            make
            python
            git

      - name: Verify Windows toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion sdl2

      - name: Generate synthetic SML2-shaped ROM
        shell: pwsh
        run: |
          $rom = New-Object byte[] (512 * 1024)
          $title = [Text.Encoding]::ASCII.GetBytes("MARIOLAND2")
          [Array]::Copy($title, 0, $rom, 0x134, $title.Length)
          $rom[0x147] = 0x01
          $rom[0x148] = 0x04
          $rom[0x149] = 0x00
          $rom[0x801C] = 0x19
          New-Item -ItemType Directory -Force ci | Out-Null
          [IO.File]::WriteAllBytes("$PWD\ci\sml2_smoke.gb", $rom)

      - name: Build bundled Wario player
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch feature/wario-companion-deck https://github.com/TotallyJustRetro/warko.git ci/warko
          echo "Wario player source commit: $(git -C ci/warko rev-parse HEAD)"
          python ci/warko/gbrecomp.py --player -o ci/warko/build/player
          make -C ci/warko/build/player OPT=-O2 -j2
          test -f ci/warko/build/player/gbplayer.exe

      - name: Configure PipeClean Dev
        shell: msys2 {0}
        run: |
          cmake -S . -B build-dev -DROM="$PWD/ci/sml2_smoke.gb" -DCMAKE_BUILD_TYPE=Release -DPIPECLEAN_DEV_BUILD=ON

      - name: Build developer runtime
        shell: msys2 {0}
        run: |
          cmake --build build-dev --target PipeClean --parallel 2

      - name: Smoke-test developer runtime
        shell: msys2 {0}
        run: |
          ./build-dev/PipeClean.exe --headless --frames 2 --no-crc-check --wide 100 ci/sml2_smoke.gb

      - name: Stage Dev runtime and required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist/PipeClean-Dev-Windows-x64/assets
          cp build-dev/PipeClean.exe dist/PipeClean-Dev-Windows-x64/PipeClean.exe
          cp ci/warko/build/player/gbplayer.exe dist/PipeClean-Dev-Windows-x64/gbplayer.exe
          cp assets/pipeclean-icon.svg assets/pipeclean-logo.svg assets/pipeclean-logo.webp assets/cacert.pem dist/PipeClean-Dev-Windows-x64/assets/
          {
            ldd build-dev/PipeClean.exe
            ldd ci/warko/build/player/gbplayer.exe
            ldd /ucrt64/bin/SDL2.dll
          } | awk '/=> \/ucrt64\// {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/PipeClean-Dev-Windows-x64/
          done
          test -s dist/PipeClean-Dev-Windows-x64/assets/pipeclean-icon.svg
          test -s dist/PipeClean-Dev-Windows-x64/assets/pipeclean-logo.svg
          test -s dist/PipeClean-Dev-Windows-x64/assets/pipeclean-logo.webp
          test -s dist/PipeClean-Dev-Windows-x64/assets/cacert.pem

      - name: Package PipeClean Dev artifact
        shell: pwsh
        run: |
          Copy-Item README.md, INSTALL.md, LEGAL.md, THIRD_PARTY.md dist\PipeClean-Dev-Windows-x64\
          Compress-Archive -Path dist\PipeClean-Dev-Windows-x64 -DestinationPath PipeClean-Dev-Windows-x64.zip -Force

      - name: Upload Dev build
        uses: actions/upload-artifact@v7
        with:
          name: PipeClean-Dev-Windows-x64
          path: PipeClean-Dev-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
