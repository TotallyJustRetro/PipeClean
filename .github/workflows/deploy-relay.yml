name: Deploy PipeClean traversal relay

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Unique Fly.io application name (becomes APP_NAME.fly.dev)
        required: true
        type: string
      org:
        description: Fly.io organization slug
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeclean-traversal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RELAY_APP_NAME: ${{ inputs.app_name }}
      FLY_ORG: ${{ inputs.org }}
    steps:
      - name: Check out selected PipeClean revision
        uses: actions/checkout@v4

      - name: Validate deployment inputs and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::error::Add an organization-scoped Fly API token as the GitHub Actions secret FLY_API_TOKEN."
            exit 1
          fi
          if [[ ! "$RELAY_APP_NAME" =~ ^[a-z][a-z0-9-]{2,30}$ ]]; then
            echo "::error::App name must be 3-31 characters, start with a lowercase letter, and contain only lowercase letters, digits, or hyphens."
            exit 1
          fi
          if [[ ! "$FLY_ORG" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::Use the Fly organization slug, not a display name."
            exit 1
          fi

      - name: Install Fly CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Configure the selected Fly application
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELAY_APP_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          app_name = sys.argv[1]
          path = Path("fly.toml")
          config = path.read_text(encoding="utf-8")
          updated, count = re.subn(r'(?m)^app\s*=\s*"[^"]+"$', f'app = "{app_name}"', config, count=1)
          if count != 1:
              raise SystemExit("Could not update the app setting in fly.toml")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Create the app if needed
        shell: bash
        run: |
          set -euo pipefail
          if flyctl status --app "$RELAY_APP_NAME" >/dev/null 2>&1; then
            echo "Using existing Fly application $RELAY_APP_NAME."
          else
            flyctl apps create "$RELAY_APP_NAME" --org "$FLY_ORG" --yes
          fi

      - name: Deploy and verify traversal relay
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$RELAY_APP_NAME" --config fly.toml --remote-only --yes
          flyctl status --app "$RELAY_APP_NAME"
          echo "relay_endpoint=tls://$RELAY_APP_NAME.fly.dev:443" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Publish relay address
        shell: bash
        run: |
          {
            echo "### PipeClean traversal relay deployed"
            echo
            echo 'Relay address: `tls://${{ inputs.app_name }}.fly.dev:443`'
            echo
            echo "Set this address as PipeClean's default traversal endpoint after confirming the deployment is healthy."
          } >> "$GITHUB_STEP_SUMMARY"
