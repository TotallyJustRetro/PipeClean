name: Deploy PipeClean traversal relay

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-relay.yml"
      - "fly.toml"
      - "server/**"
      - "tests/test_relay.js"
  workflow_dispatch:
    inputs:
      app_name:
        description: Unique Fly.io application name (becomes APP_NAME.fly.dev)
        required: true
        type: string
      org:
        description: Fly.io organization slug
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeclean-traversal-deploy
  cancel-in-progress: false

jobs:
  validate-traversal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate relay syntax and integration
        run: |
          node --check server/relay.js
          node tests/test_relay.js

      - name: Validate Fly service configuration
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("fly.toml").read_text(encoding="utf-8"))
          services = config.get("services", [])
          assert len(services) == 1, "Expected one relay service"
          service = services[0]
          assert service.get("internal_port") == 27800
          ports = service.get("ports", [])
          assert any(
              port.get("port") == 443
              and "tls" in port.get("handlers", [])
              and "proxy_proto" in port.get("handlers", [])
              and port.get("proxy_proto_options", {}).get("version") == "v2"
              for port in ports
          ), "Port 443 must terminate TLS and forward PROXY protocol v2"
          assert config.get("env", {}).get("PIPECLEAN_RELAY_PROXY_PROTOCOL") == "1"
          print("Fly traversal configuration: PASS")
          PY

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RELAY_APP_NAME: ${{ inputs.app_name }}
      FLY_ORG: ${{ inputs.org }}
    steps:
      - name: Check out selected PipeClean revision
        uses: actions/checkout@v4

      - name: Validate deployment inputs and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::error::Add an organization-scoped Fly API token as the GitHub Actions secret FLY_API_TOKEN."
            exit 1
          fi
          if [[ ! "$RELAY_APP_NAME" =~ ^[a-z][a-z0-9-]{2,30}$ ]]; then
            echo "::error::App name must be 3-31 characters, start with a lowercase letter, and contain only lowercase letters, digits, or hyphens."
            exit 1
          fi
          if [[ ! "$FLY_ORG" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::Use the Fly organization slug, not a display name."
            exit 1
          fi

      - name: Install Fly CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Configure the selected Fly application
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELAY_APP_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          app_name = sys.argv[1]
          path = Path("fly.toml")
          config = path.read_text(encoding="utf-8")
          updated, count = re.subn(r'(?m)^app\s*=\s*"[^"]+"$', f'app = "{app_name}"', config, count=1)
          if count != 1:
              raise SystemExit("Could not update the app setting in fly.toml")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Create the app if needed
        shell: bash
        run: |
          set -euo pipefail
          if flyctl status --app "$RELAY_APP_NAME" >/dev/null 2>&1; then
            echo "Using existing Fly application $RELAY_APP_NAME."
          else
            flyctl apps create "$RELAY_APP_NAME" --org "$FLY_ORG" --yes
          fi

      - name: Deploy and verify traversal relay
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$RELAY_APP_NAME" --config fly.toml --remote-only --yes
          flyctl status --app "$RELAY_APP_NAME"
          echo "relay_endpoint=tls://$RELAY_APP_NAME.fly.dev:443" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Set deployed relay as the app default
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELAY_APP_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          endpoint = f"tls://{sys.argv[1]}.fly.dev:443"
          path = Path("runtime/settings.h")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^#define PIPECLEAN_DEFAULT_RELAY_ENDPOINT .+$")
          updated, count = pattern.subn(
              lambda _match: f'#define PIPECLEAN_DEFAULT_RELAY_ENDPOINT "{endpoint}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not configure the default relay endpoint in runtime/settings.h")
          path.write_text(updated, encoding="utf-8")
          PY
          git add fly.toml runtime/settings.h
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Configure default PipeClean traversal server"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "The deployed relay is already configured as the default."
          fi

      - name: Trigger builds and regression tests for the configured endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run regression.yml --ref "$GITHUB_REF_NAME"
          gh workflow run android-build.yml --ref "$GITHUB_REF_NAME"

      - name: Publish relay address
        shell: bash
        run: |
          {
            echo "### PipeClean traversal relay deployed"
            echo
            echo 'Relay address: `tls://${{ inputs.app_name }}.fly.dev:443`'
            echo
            echo "The deployed TLS relay is the default for fresh installs. Existing settings using the old localhost default are migrated."
            echo "Endpoint config was committed to branch: $GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
